spring.application.name=app

# DATABASE
# ===============================
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true

# ===============================
# MAIL CONFIGURATION
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ===============================
# JWT SECRET KEY
# ===============================
jwt.secret-key=${JWT_SECRET}

storage.spendoo.key=${STORAGE_SPENDOO_KEY}
storage.spendoo.secret=${STORAGE_SPENDOO_SECRET}
storage.spendoo.endpoint=${STORAGE_SPENDOO_ENDPOINT}
storage.spendoo.cdn-endpoint=${STORAGE_SPENDOO_CDN_ENDPOINT}
storage.spendoo.bucket=${STORAGE_SPENDOO_BUCKET}

identity.resources.profile-image-directory=${PROFILE_IMAGE_DIRECTORY}

# Multipart file size
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

file-size.modules.identity=5
